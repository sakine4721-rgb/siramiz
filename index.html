<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sıramız – Sınıf Oturma Düzeni</title>
<style>
:root{--bg:#eef1f4;--ink:#1f2933;--muted:#5d6b78;--card:#fff;--line:#c9d1d9;--a:#2f5d50;--bd:#2f5d50;--d:#d9b98a;--de:#b8935f}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.brand svg{width:52px;height:52px;flex:none}
.brand h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.1;color:var(--a)}
.brand p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
input[type=text],select{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.title{font-weight:800;font-size:1.1rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
button,.btn{font:inherit;font-weight:700;font-size:.88rem;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-block;position:relative;overflow:hidden}
.p,button.on{background:var(--a);color:#fff;border-color:var(--a)}
.fin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
button:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-within{outline:3px solid var(--a);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.st{display:flex;align-items:center;gap:8px;margin:4px 0}
.st span{flex:1;font-size:.88rem}
.st button{padding:4px 12px;font-size:1.1rem}
.st .v{min-width:1.8em;text-align:center;font-weight:800}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem}
#tot{font-size:.85rem;color:var(--muted);margin-top:4px}
#msg{min-height:1.3em;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.room{overflow-x:auto;padding-bottom:8px}
.floor{max-width:980px;margin:0 auto;display:flex;gap:8px;background:#fff;padding:8px;border-radius:8px;border:2px solid var(--line)}
.main{flex:1;min-width:0}
.winc{width:22px;flex:none;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px}
.win{flex:1;max-height:90px;background:#bfe3f5;border:2px solid #7fb3cf;border-radius:3px}
.front{display:flex;gap:8px;margin-bottom:12px}
.pano{flex:1;background:#c9a06b;border:2px solid #9a7440;border-radius:6px;text-align:center;padding:10px 4px;font-weight:800;color:#4a3414;font-size:.8rem}
.board{flex:2.2;background:var(--bd);color:#e6f2ee;text-align:center;padding:10px;border-radius:6px;font-weight:800;letter-spacing:.05em}
.tdesk{flex:1.2;background:var(--d);border:2px solid var(--de);border-radius:6px;text-align:center;padding:10px 4px;font-weight:700;color:#3b2d17;font-size:.8rem}
.floor .lbl{letter-spacing:inherit;width:100%;border:0;background:transparent;text-align:center;font:inherit;color:inherit;padding:0;min-width:0;border-radius:4px}
.floor .lbl:focus{background:rgba(255,255,255,.55)}
.cname{width:50%;min-width:170px;margin:0 auto 10px;background:var(--a);color:#fff;border-radius:8px;padding:6px 12px;font-weight:800;font-size:1.05rem;text-align:center}
.layout{display:grid;gap:12px 14px}
.grp{display:grid;gap:5px;background:var(--d);border:2px solid var(--de);padding:5px;border-radius:8px}
.seat{position:relative;background:var(--card);border-radius:6px;padding:4px;text-align:center;min-width:0}
.seat.over{outline:3px dashed var(--a)}
.seat.sel{outline:3px solid #e0a100}
.ph{aspect-ratio:3/4;width:100%;border-radius:4px;background:var(--bg) center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);position:relative;overflow:hidden}
.ph.has{border:2px solid var(--a)}
.ph b{font-size:1.4rem}
.no{position:absolute;top:3px;left:4px;font-size:.7rem;font-weight:800;color:var(--muted);background:var(--card);border-radius:4px;padding:0 4px;pointer-events:none}
.nm,.nt{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:center;padding:2px;min-width:0}
.nm{margin-top:4px;font-size:.78rem}
.nt{font-size:.68rem;color:var(--muted)}
.x{position:absolute;top:2px;right:2px;z-index:2;padding:0 7px;font-size:.9rem;border-radius:50%}
.phead{display:none;text-align:center;margin-bottom:8px}
.phead div:nth-child(2){font-size:1.4rem;font-weight:800}
#pwrap{display:none}
@media print{@page{margin:8mm}body.printing{padding:0;background:#fff}body.printing>*:not(#pwrap){display:none!important}body.printing #pwrap{display:block}#pwrap img{display:block;width:100%;height:auto;max-height:272mm;object-fit:contain;margin:0 auto}}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:14px}
@media print{.bar,.panel,.r2,.brand,#msg,.x{display:none!important}body{background:#fff;color:#000}.room{overflow:visible}.phead{display:block}}
</style>
<style id="pgst"></style>
</head>
<body>
<div id="pwrap"><img id="pimg" alt="Oturma düzeni"></div>
<div class="brand">
  <svg viewBox="0 0 64 64" role="img" aria-label="Sıramız logosu">
    <rect width="64" height="64" rx="14" fill="#2f5d50"/>
    <rect x="12" y="9" width="40" height="7" rx="2" fill="#e6f2ee"/>
    <g fill="#d9b98a"><rect x="11" y="24" width="20" height="14" rx="3"/><rect x="33" y="24" width="20" height="14" rx="3"/><rect x="11" y="43" width="20" height="14" rx="3"/><rect x="33" y="43" width="20" height="14" rx="3"/></g>
    <g fill="#fff"><circle cx="21" cy="31" r="4.5"/><circle cx="43" cy="31" r="4.5"/><circle cx="21" cy="50" r="4.5"/></g>
    <circle cx="43" cy="50" r="4.5" fill="#f2b632"/>
  </svg>
  <div><h1>Sıramız</h1><p>Fotoğraflı sınıf oturma düzeni</p></div>
</div>
<div class="r2"><input type="text" id="school" placeholder="Okul adı" aria-label="Okul adı"><input type="text" id="teacher" placeholder="Öğretmen adı" aria-label="Öğretmen adı"></div>
<div class="r2" id="r2c"><select id="cls" aria-label="Sınıf seç"></select><input type="text" id="title" class="title" aria-label="Sınıf adı"></div>
<div class="panel">
  <div class="st" data-k="cols" data-min="1" data-max="8"><span>Sıra grubu (sütun) sayısı</span><button type="button" aria-label="Azalt">−</button><b class="v"></b><button type="button" aria-label="Artır">+</button></div>
  <div class="st" data-k="rows" data-min="1" data-max="10"><span>Sıra (satır) sayısı</span><button type="button" aria-label="Azalt">−</button><b class="v"></b><button type="button" aria-label="Artır">+</button></div>
  <div class="st" data-k="per" data-min="1" data-max="8"><span>Her sırada kaç öğrenci</span><button type="button" aria-label="Azalt">−</button><b class="v"></b><button type="button" aria-label="Artır">+</button></div>
  <div id="tot"></div>
  <div class="bar" style="margin:8px 0 0">
    <select id="win" aria-label="Pencere"><option value="sol">Pencere: sol</option><option value="sag">Pencere: sağ</option><option value="yok">Pencere yok</option></select>
    <label class="chk"><input type="checkbox" id="pano"> Pano</label>
    <select id="thm" aria-label="Renk teması"><option value="yesil">Yeşil tema</option><option value="mavi">Mavi tema</option><option value="mor">Mor tema</option><option value="turuncu">Turuncu tema</option></select>
  </div>
</div>
<div class="bar">
  <label class="btn p">Toplu fotoğraf ekle<input id="multi" class="fin" type="file" accept="image/*" multiple></label>
  <button id="shuf" type="button">Rastgele yerleştir</button>
  <button id="undo" type="button" hidden>Geri al</button>
  <button id="swap" type="button">Yer değiştir: kapalı</button>
</div>
<div class="bar">
  <button id="png" type="button">Resim olarak indir</button>
  <button id="print" type="button">Yazdır / PDF</button>
  <button id="bk" type="button">Yedekle</button>
  <label class="btn">Yedeği geri yükle<input id="rs" class="fin" type="file" accept=".json,application/json"></label>
  <button id="clear" type="button">Temizle</button>
</div>
<div id="msg" role="status">Yükleniyor…</div>
<noscript>Bu uygulama için JavaScript gereklidir.</noscript>
<div class="room"><div class="floor" id="floor">
  <div class="winc" id="wl"></div>
  <div class="main">
    <div class="phead" id="phead"></div>
    <div class="cname fx" data-k="cname"><input type="text" id="cn" class="lbl" maxlength="30" aria-label="Sınıf adı levhası" placeholder="Sınıf adı"></div>
    <div class="front">
      <div class="pano fx" id="panoEl" data-k="pano"><input type="text" id="lp" class="lbl" maxlength="24" aria-label="Pano yazısı"></div>
      <div class="board fx" data-k="board"><input type="text" id="lb" class="lbl" maxlength="24" aria-label="Tahta yazısı"></div>
      <div class="tdesk fx" data-k="tdesk"><input type="text" id="lt" class="lbl" maxlength="24" aria-label="Öğretmen masası yazısı"></div>
    </div>
    <div id="layout" class="layout"></div>
  </div>
  <div class="winc" id="wr"></div>
</div></div>
<footer>© 2026 Sakine. Tüm hakları saklıdır. Fotoğraflar yalnızca kendi cihazınızda kalır, hiçbir yere yüklenmez.</footer>
<script>
(function(){
var KEY="siramiz-v2";
var T={yesil:{a:"#2f5d50",bd:"#2f5d50",d:"#d9b98a",de:"#b8935f"},mavi:{a:"#2b5c8a",bd:"#25496b",d:"#cfc3a8",de:"#a89a78"},
  mor:{a:"#6b4a8e",bd:"#4a3566",d:"#dcc7a0",de:"#b39a6b"},turuncu:{a:"#c25a1a",bd:"#3c4a45",d:"#e0c08a",de:"#b8935f"}};
var S={classes:[],cur:0,school:"",teacher:"",theme:"yesil",pano:true,win:"sol",lp:"PANO",lt:"Öğretmen masası",lb:"TAHTA"};
var prev=null,swapMode=false,picked=null,dragFrom=null,armDel=false,armClr=false,saveT=null;
function $(i){return document.getElementById(i)}
function say(t){$("msg").textContent=t}
function b1(){return{photo:"",name:"",note:""}}
function fit(c){var n=c.cols*c.rows*c.per;while(c.seats.length<n)c.seats.push(b1());c.seats.length=n}
function mk(name,cols,rows,per,old){var c={name:name,cols:cols,rows:rows,per:per,seats:old||[]};fit(c);return c}
function cur(){return S.classes[S.cur]}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var d=JSON.parse(r);
      if(d&&d.classes&&d.classes.length){S=Object.assign(S,d);S.classes.forEach(function(c){fit(c)});if(S.cur>=S.classes.length)S.cur=0;return}}
    var o=localStorage.getItem("siramiz-v1");
    if(o){var v=JSON.parse(o),m=v.lay==="tekli"?[6,5,1]:v.lay==="grup"?[5,1,6]:[3,5,2];
      S.classes=[mk(v.title||"Sınıf 1",m[0],m[1],m[2],(v.seats||[]).map(function(s){return{photo:s.photo||"",name:s.name||"",note:""}}))];return}
  }catch(e){}
  S.classes=[mk("Sınıf 1",3,5,2)];
}
function save(){clearTimeout(saveT);saveT=setTimeout(function(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){say("Tarayıcı kaydedemedi (hafıza dolu). Yedekle düğmesiyle dosya olarak saklayın.")}},400)}
function shrink(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){say("Fotoğraf okunamadı: "+file.name)};
  fr.onload=function(){var im=new Image();
    im.onerror=function(){cb(fr.result)};
    im.onload=function(){var W=240,H=320,ar=W/H,sw=im.width,sh=im.height,sx=0,sy=0;
      if(sw/sh>ar){var nw=sh*ar;sx=(sw-nw)/2;sw=nw}else{var nh=sw/ar;sy=(sh-nh)*0.2;sh=nh}
      var c=document.createElement("canvas");c.width=W;c.height=H;
      c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,W,H);
      try{cb(c.toDataURL("image/jpeg",0.78))}catch(e){cb(fr.result)}};
    im.src=fr.result};
  fr.readAsDataURL(file)}
function dl(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove()}
function swapSeats(a,b){var s=cur().seats,t=s[a];s[a]=s[b];s[b]=t;save();render()}
function theme(){var p=T[S.theme]||T.yesil,r=document.documentElement.style;
  r.setProperty("--a",p.a);r.setProperty("--bd",p.bd);r.setProperty("--d",p.d);r.setProperty("--de",p.de)}
function head(){var c=cur(),h=$("phead");h.innerHTML="";
  [S.school,c.name,S.teacher?"Öğretmen: "+S.teacher:""].forEach(function(t){var d=document.createElement("div");d.textContent=t;h.appendChild(d)})}

function seatEl(i){
  var s=cur().seats[i],d=document.createElement("div");
  d.className="seat"+(picked===i?" sel":"");d.dataset.i=i;
  if(window.matchMedia&&matchMedia("(pointer:fine)").matches)d.draggable=true;
  var ph=document.createElement("div");ph.className="ph";
  if(s.photo){ph.style.backgroundImage="url("+s.photo+")";ph.classList.add("has")}else ph.innerHTML="<b>+</b>";
  var no=document.createElement("span");no.className="no";no.textContent=i+1;ph.appendChild(no);
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.className="fin";
  inp.setAttribute("aria-label",(i+1)+". öğrenci fotoğrafı seç");
  inp.addEventListener("change",function(){var f=inp.files&&inp.files[0];if(!f)return;
    shrink(f,function(u){cur().seats[i].photo=u;save();render()})});
  inp.addEventListener("click",function(e){
    if(!swapMode)return;e.preventDefault();
    if(picked===null){picked=i;say((i+1)+". kutu seçildi. Yerini değiştireceğiniz kutuya dokunun.");render()}
    else if(picked===i){picked=null;say("");render()}
    else{var a=picked;picked=null;say((a+1)+" ile "+(i+1)+". kutular yer değiştirdi.");swapSeats(a,i)}});
  ph.appendChild(inp);d.appendChild(ph);
  var nm=document.createElement("input");nm.type="text";nm.className="nm";nm.placeholder="Ad Soyad";nm.value=s.name;
  nm.setAttribute("aria-label",(i+1)+". öğrenci adı");
  nm.addEventListener("input",function(){cur().seats[i].name=nm.value;save()});d.appendChild(nm);
  var nt=document.createElement("input");nt.type="text";nt.className="nt";nt.placeholder="Not";nt.maxLength=40;nt.value=s.note||"";
  nt.setAttribute("aria-label",(i+1)+". öğrenci notu");
  nt.addEventListener("input",function(){cur().seats[i].note=nt.value;save()});d.appendChild(nt);
  if(s.photo){var x=document.createElement("button");x.type="button";x.className="x";x.textContent="×";
    x.setAttribute("aria-label","Fotoğrafı kaldır");
    x.addEventListener("click",function(){cur().seats[i].photo="";save();render()});d.appendChild(x)}
  d.addEventListener("dragstart",function(){dragFrom=i});
  d.addEventListener("dragover",function(e){e.preventDefault();d.classList.add("over")});
  d.addEventListener("dragleave",function(){d.classList.remove("over")});
  d.addEventListener("drop",function(e){e.preventDefault();if(dragFrom!==null&&dragFrom!==i)swapSeats(dragFrom,i);dragFrom=null});
  return d}

function render(){
  var c=cur(),L=$("layout"),pc=c.per<=3?c.per:Math.ceil(c.per/2),d,k,g,sel=$("cls");
  theme();
  sel.innerHTML="";
  S.classes.forEach(function(x,j){var o=document.createElement("option");o.value=j;o.textContent=x.name||"Sınıf";sel.appendChild(o)});
  sel.value=S.cur;sel.hidden=S.classes.length<2;$("r2c").style.gridTemplateColumns=S.classes.length<2?"1fr":"1fr 1fr";
  $("title").value=c.name;$("school").value=S.school;$("teacher").value=S.teacher;
  $("pano").checked=S.pano;$("lp").value=S.lp;$("lt").value=S.lt;$("lb").value=S.lb;$("cn").value=c.name;$("win").value=S.win;$("thm").value=S.theme;
  Array.prototype.forEach.call(document.querySelectorAll(".st"),function(st){st.querySelector(".v").textContent=c[st.dataset.k]});
  $("panoEl").style.display=S.pano?"":"none";
  $("wl").style.display=S.win==="sol"?"":"none";$("wr").style.display=S.win==="sag"?"":"none";
  L.innerHTML="";L.style.gridTemplateColumns="repeat("+c.cols+",1fr)";
  for(d=0;d<c.cols*c.rows;d++){
    g=document.createElement("div");g.className="grp fx";g.dataset.k="grp";
    g.style.gridTemplateColumns="repeat("+pc+",1fr)";
    for(k=0;k<c.per;k++)g.appendChild(seatEl(d*c.per+k));
    L.appendChild(g)}
  $("floor").style.minWidth=Math.max(300,c.cols*c.per*70+(S.win==="yok"?0:40))+"px";
  $("tot").textContent="Toplam: "+c.seats.length+" öğrenci kutusu";
  head();
}

function drawCanvas(done){
  try{
    var c=cur(),P=T[S.theme]||T.yesil,sc=2,fl=$("floor"),fr=fl.getBoundingClientRect(),top=76;
    var pad=16,W=Math.round(fr.width)+2*pad,H=Math.round(fr.height)+top+36;
    var cv=document.createElement("canvas");cv.width=W*sc;cv.height=H*sc;
    var x=cv.getContext("2d");x.scale(sc,sc);
    var F='"Nunito","Segoe UI",system-ui,sans-serif';
    x.fillStyle="#fff";x.fillRect(0,0,W,H);x.textAlign="center";
    x.fillStyle="#5d6b78";x.font="700 14px "+F;x.fillText(S.school||"",W/2,20,W-20);
    x.fillStyle=P.a;x.font="800 24px "+F;x.fillText(c.name||"",W/2,48,W-20);
    x.fillStyle="#5d6b78";x.font="13px "+F;x.fillText(S.teacher?"Öğretmen: "+S.teacher:"",W/2,67,W-20);
    function rel(el){var r=el.getBoundingClientRect();return{x:r.left-fr.left+pad,y:r.top-fr.top+top,w:r.width,h:r.height}}
    function box(el,f,s,rad){var r=rel(el);x.beginPath();
      if(x.roundRect)x.roundRect(r.x,r.y,r.w,r.h,rad);else x.rect(r.x,r.y,r.w,r.h);
      x.fillStyle=f;x.fill();if(s){x.strokeStyle=s;x.lineWidth=2;x.stroke()}return r}
    function rp(r,rad){x.beginPath();if(x.roundRect)x.roundRect(r.x,r.y,r.w,r.h,rad);else x.rect(r.x,r.y,r.w,r.h)}
    var M={board:[P.bd,null,S.lb,"#e6f2ee"],cname:[P.a,null,c.name,"#fff"],pano:["#c9a06b","#9a7440",S.lp,"#4a3414"],
      tdesk:[P.d,P.de,S.lt,"#3b2d17"],win:["#bfe3f5","#7fb3cf","",""],grp:[P.d,P.de,"",""]};
    rp({x:5,y:5,w:W-10,h:H-10},12);x.strokeStyle=P.a;x.lineWidth=3;x.stroke();
    box(fl,"#fff","#c9d1d9",8);
    Array.prototype.forEach.call(fl.querySelectorAll(".fx,.win"),function(el){
      if(!el.offsetWidth)return;var m=M[el.dataset.k||"win"],r=box(el,m[0],m[1],6);
      if(m[2]){x.fillStyle=m[3];x.font="800 13px "+F;x.textAlign="center";x.fillText(m[2],r.x+r.w/2,r.y+r.h/2+5,r.w-6)}});
    var jobs=[];
    Array.prototype.forEach.call(fl.querySelectorAll(".seat"),function(se){
      var i=+se.dataset.i,s=c.seats[i];box(se,"#fff","#c9d1d9",6);
      var pr=rel(se.querySelector(".ph")),nr=rel(se.querySelector(".nm")),tr=rel(se.querySelector(".nt"));
      rp(pr,5);x.fillStyle="#eef1f4";x.fill();x.strokeStyle=P.a;x.lineWidth=2.5;x.stroke();
      x.textAlign="center";x.fillStyle="#1f2933";x.font="700 "+Math.max(9,Math.min(13,pr.w/7))+"px "+F;
      x.fillText(s.name||"",nr.x+nr.w/2,nr.y+nr.h/2+4,nr.w);
      x.fillStyle="#5d6b78";x.font="600 "+Math.max(8,Math.min(11,pr.w/9))+"px "+F;
      x.fillText(s.note||"",tr.x+tr.w/2,tr.y+tr.h/2+4,tr.w);
      x.textAlign="left";x.font="800 10px "+F;x.fillText(String(i+1),pr.x+4,pr.y+12);
      if(s.photo)jobs.push(new Promise(function(ok){var im=new Image();
        im.onload=function(){var ar=pr.w/pr.h,sw=im.width,sh=im.height,sx=0,sy=0;
          if(sw/sh>ar){var nw=sh*ar;sx=(sw-nw)/2;sw=nw}else{var nh=sw/ar;sy=(sh-nh)/2;sh=nh}
          x.save();rp(pr,5);x.clip();x.drawImage(im,sx,sy,sw,sh,pr.x,pr.y,pr.w,pr.h);x.restore();rp(pr,5);x.strokeStyle=P.a;x.lineWidth=2.5;x.stroke();
          x.fillStyle="rgba(255,255,255,.85)";x.fillRect(pr.x+2,pr.y+2,16,14);
          x.fillStyle="#1f2933";x.font="800 10px "+F;x.textAlign="left";x.fillText(String(i+1),pr.x+5,pr.y+13);ok()};
        im.onerror=ok;im.src=s.photo}))});
    Promise.all(jobs).then(function(){
      x.fillStyle="#5d6b78";x.font="12px "+F;x.textAlign="center";x.fillText("© 2026 Sakine – Sıramız",W/2,H-9);
      done(cv)});
  }catch(e){done(null)}
}
function exportPng(){
  drawCanvas(function(cv){
    if(!cv){say("Resim oluşturulamadı.");return}
    cv.toBlob(function(bl){dl(bl,((cur().name||"oturma-duzeni").replace(/[\\\/:*?"<>|]+/g,""))+".png");say("Resim indirildi.")},"image/png")})
}
function printPng(){
  say("Yazdırma için hazırlanıyor…");
  drawCanvas(function(cv){
    if(!cv){say("Hazırlanamadı. Resim olarak indirip yazdırabilirsiniz.");return}
    var land=cv.width>=cv.height,im=$("pimg");
    $("pgst").textContent="@media print{@page{size:A4 "+(land?"landscape":"portrait")+";margin:8mm}#pwrap img{max-height:"+(land?"192mm":"279mm")+"}}";
    im.onload=function(){document.body.classList.add("printing");say("");
      setTimeout(function(){
        try{window.print()}catch(e){say("Yazdırma açılamadı. Resim olarak indirip yazdırabilirsiniz.")}
        document.addEventListener("pointerdown",function f(){document.body.classList.remove("printing");document.removeEventListener("pointerdown",f)})
      },300)};
    im.removeAttribute("src");im.src=cv.toDataURL("image/jpeg",0.92)})
}

Array.prototype.forEach.call(document.querySelectorAll(".st"),function(st){
  var k=st.dataset.k,mn=+st.dataset.min,mx=+st.dataset.max,bs=st.querySelectorAll("button");
  function go(dv){var c=cur(),o=c[k],v=o+dv,before;
    if(v<mn||v>mx)return;c[k]=v;
    if(c.cols*c.rows*c.per>120){c[k]=o;say("En fazla 120 öğrenci kutusu olabilir.");return}
    before=c.seats.length;fit(c);prev=null;$("undo").hidden=true;
    say(c.seats.length<before?"Fazla kutular kaldırıldı.":"");save();render()}
  bs[0].addEventListener("click",function(){go(-1)});bs[1].addEventListener("click",function(){go(1)})});
[$("wl"),$("wr")].forEach(function(w){for(var i=0;i<4;i++){var d=document.createElement("div");d.className="win";w.appendChild(d)}});

$("school").addEventListener("input",function(){S.school=this.value;head();save()});
$("teacher").addEventListener("input",function(){S.teacher=this.value;head();save()});
function setName(v,src){var c=cur();c.name=v;$("cls").options[S.cur].textContent=v||"Sınıf";
  if(src!==$("title"))$("title").value=v;if(src!==$("cn"))$("cn").value=v;head();save()}
$("title").addEventListener("input",function(){setName(this.value,this)});
$("cn").addEventListener("input",function(){setName(this.value,this)});
$("lb").addEventListener("input",function(){S.lb=this.value;save()});
$("cls").addEventListener("change",function(){S.cur=+this.value;prev=null;$("undo").hidden=true;picked=null;save();render()});
$("lp").addEventListener("input",function(){S.lp=this.value;save()});
$("lt").addEventListener("input",function(){S.lt=this.value;save()});
$("pano").addEventListener("change",function(){S.pano=this.checked;save();render()});
$("win").addEventListener("change",function(){S.win=this.value;save();render()});
$("thm").addEventListener("change",function(){S.theme=this.value;save();render()});

$("multi").addEventListener("change",function(){
  var inp=this,fs=Array.prototype.slice.call(inp.files||[]),free=[],c=cur();
  c.seats.forEach(function(s,i){if(!s.photo)free.push(i)});
  if(!fs.length)return;
  fs.sort(function(a,b){return a.name.localeCompare(b.name,"tr",{numeric:true})});
  var use=fs.slice(0,free.length),left=use.length;
  if(!left){say("Boş kutu yok. Sıra sayısını artırabilirsiniz.");return}
  say(left+" fotoğraf yerleştiriliyor…");
  use.forEach(function(f,k){shrink(f,function(u){var s=c.seats[free[k]];s.photo=u;
    if(!s.name)s.name=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");
    if(--left===0){save();render();say(use.length+" fotoğraf eklendi."+(fs.length>use.length?" "+(fs.length-use.length)+" fotoğraf sığmadı, sıra sayısını artırın.":""))}})});
  inp.value=""});
$("shuf").addEventListener("click",function(){
  var a=cur().seats,i,j,t;prev=a.slice();
  for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
  $("undo").hidden=false;say("Öğrenciler karıştırıldı. Beğenmezseniz Geri al'a basın.");save();render()});
$("undo").addEventListener("click",function(){
  if(!prev)return;cur().seats=prev;prev=null;this.hidden=true;save();render();say("Önceki düzen geri yüklendi.")});
$("swap").addEventListener("click",function(){
  swapMode=!swapMode;picked=null;this.textContent="Yer değiştir: "+(swapMode?"açık":"kapalı");
  this.className=swapMode?"on":"";say(swapMode?"İki kutuya sırayla dokunarak yerlerini değiştirin.":"");render()});
$("png").addEventListener("click",exportPng);
$("print").addEventListener("click",printPng);
$("bk").addEventListener("click",function(){
  dl(new Blob([JSON.stringify(S)],{type:"application/json"}),"siramiz-yedek.json");say("Yedek dosyası indirildi.")});
$("rs").addEventListener("change",function(){
  var inp=this,f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d.classes||!d.classes.length)throw 0;
    S=Object.assign({classes:[],cur:0,school:"",teacher:"",theme:"yesil",pano:true,win:"sol",lp:"PANO",lt:"Öğretmen masası",lb:"TAHTA"},d);
    S.classes.forEach(function(c){c.seats=c.seats||[];fit(c)});S.cur=0;prev=null;save();render();say("Yedek yüklendi.")}
    catch(e){say("Bu dosya geçerli bir Sıramız yedeği değil.")}};
  r.readAsText(f);inp.value=""});
$("clear").addEventListener("click",function(){var b=this;
  if(!armClr){armClr=true;b.textContent="Emin misiniz? Tekrar dokunun";
    setTimeout(function(){armClr=false;b.textContent="Temizle"},4000);return}
  armClr=false;b.textContent="Temizle";var c=cur();c.seats=[];fit(c);prev=null;$("undo").hidden=true;
  save();render();say("Bu sınıfın fotoğraf ve isimleri temizlendi.")});

load();render();
say("Hazır. Bir kutudaki + işaretine dokunarak fotoğraf ekleyin. Veriler yalnızca bu cihazda saklanır.");
})();
</script>
